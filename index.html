<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131d">
  <meta name="description" content="左右2つの答えから正しいコースを選ぶ、小学生向けの算数レーシングゲーム。">
  <title>サーキット算数レーシング</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/questions.js" defer></script>
  <script src="js/game.js" defer></script>
</head>
<body>
  <main id="game" class="game" aria-label="サーキット算数レーシングゲーム">
    <div class="stands" aria-hidden="true"></div><div class="pit" aria-hidden="true"></div><div class="fence" aria-hidden="true"></div><div class="road" aria-hidden="true"><div class="line"></div></div>
    <div class="hud">
      <div class="pill">🏁 CIRCUIT MATH</div>
      <div class="pill">問題 <span id="progress">0 / 10</span></div>
      <div class="pill">得点 <span id="score">0</span></div>
    </div>
    <section id="question" class="question" aria-live="polite">
      <small>左右2つから、正しいコースを選ぼう</small>
      <strong id="prompt"></strong>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
    <button id="left" type="button" class="choice left" aria-label="左の答え" disabled></button>
    <button id="right" type="button" class="choice right" aria-label="右の答え" disabled></button>
    <div id="car" class="car" aria-hidden="true"><div class="tire l"></div><div class="tire r"></div><div class="body"></div><div class="roof"></div><div class="wing"></div><div class="lamp l"></div><div class="lamp r"></div><div class="diffuser"></div><div class="number">GT 01</div></div>
    <div id="start" class="overlay">
      <div class="card">
        <h1>🏎️ サーキット算数</h1>
        <p>正しい答えのコースを選んでゴールを目指そう！<br>1レース10問。問題は毎回ちがう順番で出題されます。</p>
        <button id="startBtn" type="button" class="mainbtn">スタート</button>
      </div>
    </div>
    <div id="result" class="overlay result" aria-live="assertive">
      <div class="card">
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
        <button id="retry" type="button" class="mainbtn">もう一度走る</button>
      </div>
    </div>
  </main>
</body>
</html>
